[pytest]
asyncio_mode = auto

# AUD5-PRAC-2. `test_upload.py` и `test_frontend.py` — не тесты, а ручные
# smoke-скрипты: они ходят по сети в ЖИВОЙ стек (`http://media-api:8000`,
# localhost) и вместо assert'ов ловят исключение, печатают эмодзи и делают
# `return False`. Под pytest такой возврат — это PASSED с предупреждением, то
# есть они зелёные ВСЕГДА, в том числе когда сервис лежит.
#
# Гейт, построенный на таких файлах, дал бы ровно ту ложную уверенность, за
# которую отдельно заведён AUD5-CODE-4 («псевдо-тест в CI: ни одного assert»),
# поэтому из автоматического сбора они исключены. Руками при живом стеке они
# по-прежнему запускаются: `python test_upload.py`.
# (Судьба самих файлов — AUD5-JUNK-2, решение владельца; здесь их не трогаем.)
addopts = --ignore=test_upload.py --ignore=test_frontend.py
