[pytest]
asyncio_mode = auto

# AUD5-PRAC-2. `test_upload.py` — не тест, а ручной smoke-скрипт: он ходит по
# сети в ЖИВОЙ стек (`http://media-api:8000`) и вместо assert'ов ловит
# исключение, печатает эмодзи и делает
# `return False`. Под pytest такой возврат — это PASSED с предупреждением, то
# есть они зелёные ВСЕГДА, в том числе когда сервис лежит.
#
# Гейт, построенный на таких файлах, дал бы ровно ту ложную уверенность, за
# которую отдельно заведён AUD5-CODE-4 («псевдо-тест в CI: ни одного assert»),
# поэтому из автоматического сбора он исключён. Руками при живом стеке
# по-прежнему запускается: `python test_upload.py`.
# (`test_frontend.py` удалён вместе с тестовым фронтом — AUD5-JUNK-2,
# решение владельца 2026-07-27.)
addopts = --ignore=test_upload.py
