[project]
name = "resource-accounting-api"
version = "0.1.0"
description = "UK Resource Accounting service: meters, readings, reconciliation exports"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "httpx>=0.27",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    # A9-P3-24: mypy-шаг CI-джобы resource-tests (ratchet на число ошибок);
    # пин как у бота (ci.yml, джоба mypy) — счёт зависит от версии mypy.
    "mypy==1.7.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `tests/` — namespace-пакет без __init__.py, а конфтест импортируется как
# `from tests.conftest import ...` — для этого корень сервиса обязан быть на
# sys.path. `python -m pytest` добавляет cwd молча, ГОЛЫЙ `pytest` (CI) — нет:
# без этой строки джоба падала ModuleNotFoundError: No module named 'tests'.
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
# A9-P3-24: в CI (джоба resource-tests) — advisory по содержанию, ratchet на
# количество: ci/mypy-baseline-resource.txt через ci/mypy_ratchet.py.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
