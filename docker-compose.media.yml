# Override-compose: integrates media-service into the main uk stack.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.media.yml up -d
#
# Shares uk-network, postgres (own logical DB uk_media), redis with the
# main stack. ARCH-106 Phase 2: секреты (bot token, SECRET_KEY, MEDIA_API_KEYS,
# DATABASE_URL) приходят из Doppler через `doppler run --`; media_service/.env
# держит только несекретную конфигурацию (CHANNEL_*, ALLOWED_ORIGINS, DEBUG, лимиты).
services:
  media-service:
    build:
      context: ./media_service
      dockerfile: Dockerfile
    image: uk-media-service
    container_name: uk-media-service
    restart: unless-stopped
    env_file:
      - media_service/.env
    environment:
      # Строгие :?-гарды: media поддерживается на обоих хостах (решение владельца).
      # Пустые :--заглушки здесь ЗАПРЕЩЕНЫ — environment: приоритетнее env_file и
      # молча затёр бы значения из media_service/.env.
      - TELEGRAM_BOT_TOKEN=${MEDIA_BOT_TOKEN:?MEDIA_BOT_TOKEN is required — set it in Doppler (project uk-management)}
      - SECRET_KEY=${MEDIA_SECRET_KEY:?MEDIA_SECRET_KEY is required — set it in Doppler (project uk-management)}
      - MEDIA_API_KEYS=${MEDIA_API_KEYS:?MEDIA_API_KEYS is required — set it in Doppler (project uk-management)}
      # Полный URI целиком (не собирается из компонента-пароля).
      - DATABASE_URL=${MEDIA_DATABASE_URL:?MEDIA_DATABASE_URL is required — set it in Doppler (project uk-management)}
    volumes:
      - media_uploads:/app/data/uploads
      # Кэш превью публичной витрины — томом, чтобы рестарт его не сбрасывал.
      - media_preview_cache:/app/.preview-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uk-network
    ports:
      - "127.0.0.1:8009:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # One-shot runner for media_service/migrations/*.sql (run_migrations.py) —
  # applies column/index migrations that Base.metadata.create_all() does NOT
  # cover (create_all only creates missing tables, never alters existing
  # ones). Same shape as the bot-side `migrate` service in docker-compose.yml:
  # profiles: ["tools"] keeps it out of `up -d`; invoke explicitly:
  #   docker compose -f docker-compose.yml -f docker-compose.media.yml run --rm media-migrate
  media-migrate:
    build:
      context: ./media_service
      dockerfile: Dockerfile
    image: uk-media-service
    profiles: ["tools"]
    command: ["python", "run_migrations.py"]
    env_file:
      - media_service/.env
    environment:
      # Duplicates every Settings field that has no safe default (secrets + DB URL) —
      # mirrors the bot-side `migrate` service's own reasoning: Settings eagerly
      # validates several vars at import time even though this job only touches
      # the DB, so a partial env here would crash on import before reaching main().
      # REDIS_URL is deliberately excluded: migrate doesn't touch Redis, and
      # settings.redis_url has a safe default (unlike the vars below).
      - TELEGRAM_BOT_TOKEN=${MEDIA_BOT_TOKEN:?MEDIA_BOT_TOKEN is required — set it in Doppler (project uk-management)}
      - SECRET_KEY=${MEDIA_SECRET_KEY:?MEDIA_SECRET_KEY is required — set it in Doppler (project uk-management)}
      - MEDIA_API_KEYS=${MEDIA_API_KEYS:?MEDIA_API_KEYS is required — set it in Doppler (project uk-management)}
      - DATABASE_URL=${MEDIA_DATABASE_URL:?MEDIA_DATABASE_URL is required — set it in Doppler (project uk-management)}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uk-network

volumes:
  media_uploads:
    driver: local
  media_preview_cache:
    driver: local
