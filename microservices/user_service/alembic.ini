# Alembic Configuration for User Service
# UK Management Bot - Building Directory Implementation

[alembic]
# Path to migration scripts
script_location = alembic

# Template for naming version files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone for version file timestamps
timezone = UTC

# Maximum length of characters to apply to the
# "slug" field in the naming scheme
truncate_slug_length = 40

# Version path separator
version_path_separator = os

# Output encoding used when revision files are written
output_encoding = utf-8

# Database connection string - will be overridden by env.py from config
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
