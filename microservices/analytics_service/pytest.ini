[pytest]
# Pytest configuration for Analytics Service

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --asyncio-mode=auto
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=60

# Coverage
[coverage:run]
source = .
omit =
    tests/*
    venv/*
    __pycache__/*
    */migrations/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests

# Asyncio
asyncio_mode = auto

# Test paths
testpaths = tests
