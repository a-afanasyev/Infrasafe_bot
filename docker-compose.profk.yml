# docker-compose.profk.yml — ТОНКИЙ override поверх базового docker-compose.yml
# для хоста profk.uz (отдельный прод-инстанс). AUD6-P2-38: раньше это был
# standalone-файл (~560 строк, ~80% копипаста базового) — теперь здесь ТОЛЬКО
# profk-дельты, всё общее живёт в docker-compose.yml.
#
# Запуск (⚠️ ОБА файла, порядок важен):
#   doppler run ... -- docker compose -f docker-compose.yml -f docker-compose.profk.yml up -d
#
# Отличия от боевого docker-compose.yml (infrasafe.uz / 105) — ТОЛЬКО инфраструктура:
#   1. uk-network = external (её создаёт InfraSafe вне compose; мы подключаемся).
#   2. Приватная сеть uk-internal — алиасы postgres/redis живут только в ней, чтобы
#      не коллизиться с infrasafe-postgres-1 в общей uk-network
#      (контракт InfraSafe: «alias postgres держите внутри своей сети»).
#   3. api/access-api — в ОБЕИХ сетях (edge→них по uk-network, они→БД по uk-internal);
#      postgres/redis/bot/tools-джобы — только uk-internal; frontend — только uk-network.
#   4. REDIS_URL ссылается на uk-redis (уникальный container_name) — детерминированный
#      DNS, без риска попасть в чужой redis; DATABASE_URL приходит из PR-7 role-файлов.
#   5. frontend собирается с VITE_BRAND=profk + VITE_BOT_USERNAME=profkbot.
#   6. postgres/redis НЕ публикуют host-порты (на shared-хосте profk они не нужны,
#      localhost:5432/6379 может занимать чужой стек).
#   7. media-service/media-migrate определены ЗДЕСЬ целиком (на 105 их даёт
#      docker-compose.media.yml; profk-вариант отличается сетью uk-internal,
#      REDIS_URL и отсутствием media_uploads-тома).
#
# YAML-теги compose-спеки: `!override` ЗАМЕНЯЕТ значение из базового файла
# (без него списки/маппинги СЛИВАЮТСЯ: networks доклеился бы, а не заменился),
# `!reset` УДАЛЯЕТ ключ базового файла (ports у postgres/redis).
#
# Контракт имён/портов InfraSafe соблюдён: uk-management-api:8080, uk-access-api:8080,
# uk-frontend:80, uk-postgres.

services:
  app:
    environment:
      # ARCH-106: REDIS_URL строится из REDIS_PASSWORD; хост — uk-redis (п.4 выше).
      - REDIS_URL=redis://:${REDIS_PASSWORD}@uk-redis:6379/0
    networks: !override
      - uk-internal

  # Group Intake — выделенный бот: тот же перевод на uk-internal/uk-redis,
  # что и у app (базовая uk-network на profk пуста — DNS до uk-postgres из
  # неё не работает; поймано на первой раскатке 2026-08-22).
  group-intake-bot:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@uk-redis:6379/0
    networks: !override
      - uk-internal

  api:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@uk-redis:6379/0
      - FRONTEND_URL=https://profk.uz/uk
    networks: !override
      - uk-network
      - uk-internal

  access-api:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@uk-redis:6379/0
    networks: !override
      - uk-network
      - uk-internal

  postgres:
    networks: !override
      - uk-internal
    # Host-порт не публикуем (п.6 выше) — !reset удаляет ports базового файла.
    ports: !reset []

  provision-roles:
    environment:
      # Уникальный container_name вместо alias postgres (см. верхний комментарий).
      RUNTIME_DB_HOST: uk-postgres
    networks: !override
      - uk-internal

  migrate:
    networks: !override
      - uk-internal

  redis:
    networks: !override
      - uk-internal
    ports: !reset []

  frontend:
    build:
      args:
        # Telegram login-widget профсоюзного бота + зелёный бренд PROFK
        # (frontend/CLAUDE.md). Остальные args наследуются из базового файла.
        VITE_BOT_USERNAME: profkbot
        VITE_BRAND: profk

  # Медиа-сервис: хранит фото/видео заявок в приватных Telegram-каналах через
  # ВЫДЕЛЕННЫЙ бот (media_service/.env: CHANNEL_* — числовые id). Основной api
  # проксирует /uk/api/v2/media/* сюда (MEDIA_SERVICE_URL=http://uk-media-service:8000).
  # Только uk-internal — наружу его не публикуем, edge ходит через основной api.
  # БД uk_media на общем uk-postgres. В базовом файле сервиса НЕТ (на 105 —
  # docker-compose.media.yml), поэтому секция здесь целиком.
  media-service:
    build:
      context: ./media_service
      dockerfile: Dockerfile
    image: uk-media-service
    container_name: uk-media-service
    restart: unless-stopped
    env_file:
      - media_service/.env
    environment:
      # ARCH-106 Phase 2: секреты media приходят из Doppler через `doppler run --`,
      # не из media_service/.env — там остаются только CHANNEL_*, ALLOWED_ORIGINS,
      # DEBUG и лимиты. Имена в Doppler отличаются от имён внутри контейнера
      # (MEDIA_-префикс), чтобы не конфликтовать с общим плоским конфигом.
      - TELEGRAM_BOT_TOKEN=${MEDIA_BOT_TOKEN:?MEDIA_BOT_TOKEN is required — set it in Doppler (project uk-management)}
      - SECRET_KEY=${MEDIA_SECRET_KEY:?MEDIA_SECRET_KEY is required — set it in Doppler (project uk-management)}
      - MEDIA_API_KEYS=${MEDIA_API_KEYS:?MEDIA_API_KEYS is required — set it in Doppler (project uk-management)}
      # Полный URI целиком (не собирается из компонента-пароля: реконструкция теряет
      # порт/query и корректное кодирование спецсимволов).
      - DATABASE_URL=${MEDIA_DATABASE_URL:?MEDIA_DATABASE_URL is required — set it in Doppler (project uk-management)}
      # ARCH-137 B4: зона показа для подписей к медиа (C1-bis); несекретное, дефолт = прежнее поведение
      - DISPLAY_TZ=${DISPLAY_TZ:-Asia/Tashkent}
      # REDIS_URL строится из REDIS_PASSWORD (Doppler, Phase 1), не берётся целиком из .env —
      # иначе пароль редиса оставался бы plaintext на диске (redis db /1 у media на profk).
      # Сам media-код redis не использует; строка нужна только чтобы убрать пароль с диска.
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in Doppler (project uk-management)}@uk-redis:6379/1
    volumes:
      # Кэш превью публичной витрины. Томом, а не в слое контейнера: иначе
      # каждый рестарт media-service сбрасывал бы кэш, и первая же загрузка
      # заполненной витрины снова пошла бы 60 скачиваниями в Telegram.
      - media_preview_cache:/app/.preview-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uk-internal
    ports:
      - "127.0.0.1:8009:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # One-shot runner для media_service/migrations/*.sql (run_migrations.py) —
  # применяет колоночные/индексные миграции, которые Base.metadata.create_all()
  # НЕ покрывает (create_all создаёт только отсутствующие таблицы, существующие
  # не меняет). Та же форма, что у бот-side `migrate`-сервиса: profiles: ["tools"]
  # держит его вне `up -d`, инвокация явная:
  #   docker compose -f docker-compose.yml -f docker-compose.profk.yml run --rm media-migrate
  media-migrate:
    build:
      context: ./media_service
      dockerfile: Dockerfile
    image: uk-media-service
    profiles: ["tools"]
    command: ["python", "run_migrations.py"]
    env_file:
      - media_service/.env
    environment:
      # Дублирует каждое поле Settings без безопасного дефолта (секреты + URL БД) —
      # та же причина, что у bot-side `migrate`: Settings эагерно валидирует
      # несколько переменных при импорте, хотя джобе нужен только доступ к БД,
      # поэтому частичный env упадёт до main().
      # REDIS_URL сознательно НЕ дублируется (в отличие от media-service выше,
      # где он есть): migrate не трогает Redis, а settings.redis_url имеет
      # безопасный дефолт (в отличие от переменных ниже).
      - TELEGRAM_BOT_TOKEN=${MEDIA_BOT_TOKEN:?MEDIA_BOT_TOKEN is required — set it in Doppler (project uk-management)}
      - SECRET_KEY=${MEDIA_SECRET_KEY:?MEDIA_SECRET_KEY is required — set it in Doppler (project uk-management)}
      - MEDIA_API_KEYS=${MEDIA_API_KEYS:?MEDIA_API_KEYS is required — set it in Doppler (project uk-management)}
      - DATABASE_URL=${MEDIA_DATABASE_URL:?MEDIA_DATABASE_URL is required — set it in Doppler (project uk-management)}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - uk-internal

  resource-postgres:
    networks: !override
      - uk-internal

  resource-provision-roles:
    networks: !override
      - uk-internal

  resource-migrate:
    networks: !override
      - uk-internal

  resource-api:
    environment:
      - RESOURCE_CORS_ORIGINS=${RESOURCE_CORS_ORIGINS:-https://profk.uz}
      - RESOURCE_FRAME_ANCESTOR=${RESOURCE_FRAME_ANCESTOR:-https://profk.uz}
    # Маппинг-форма СЛИВАЕТСЯ с базовой: uk-network с алиасами resource-api/
    # resource-api.internal наследуется, uk-internal добавляется.
    networks:
      uk-internal: {}

  resource-worker:
    networks: !override
      - uk-internal

volumes:
  media_preview_cache:
    driver: local

networks:
  # Создаёт InfraSafe — мы только подключаемся. !override: без него сюда
  # доклеился бы driver: bridge из базового файла, а external-сеть с driver —
  # ошибка валидации compose.
  uk-network: !override
    external: true
    name: uk-network
  # Наша приватная сеть: postgres/redis/bot + внутренний доступ api/access-api.
  uk-internal:
    driver: bridge
