# AUD5-PRAC-4 — e2e-спеки (Playwright) как инструмент по требованию, не как гейт.
#
# Решение владельца 2026-07-27: не nightly. Nightly требует стенда, а стенда нет;
# гонять сценарии по живому проду — значит писать в прод-данные, чего мы не делаем.
# Поэтому запуск ручной (`workflow_dispatch`) с явным адресом.
#
# Почему вообще нужна джоба, если раньше спеки просто лежали: они лежали и молча
# тухли — ни одна джоба их не собирала, поэтому сломанный локатор жил до
# следующего ручного запуска, которого могло не быть месяцами. Здесь спеки хотя
# бы КОМПИЛИРУЮТСЯ на каждом запуске, и прогон воспроизводим не только на машине
# автора.
name: e2e (manual)

# AUD8-ENG-03: минимум прав GITHUB_TOKEN по умолчанию; write только в job\'ах, где нужен.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Адрес, против которого гонять (стенд или локальный dev-сервер по туннелю)"
        required: true
        type: string

jobs:
  e2e:
    name: playwright (${{ inputs.base_url }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - run: npm ci

      # Проверка типов отдельным шагом: она полезна и тогда, когда стенд
      # недоступен, — именно она ловит стухший спек без запуска браузера.
      # AUD7-ENG-02: `npx tsc` при чистом `npm ci` шёл за пакетом `tsc` в
      # registry (TypeScript в этом пакете объявлен не был) — шаг «проходил»,
      # ничего не проверяя. Теперь typescript/@types/node в devDependencies с
      # lock, скрипт локальный; первый же честный прогон нашёл три ошибки в
      # login-flow.spec.ts (browser-код в page.evaluate без lib DOM).
      - name: Typecheck specs
        run: npm run typecheck

      - run: npx playwright install --with-deps chromium

      - name: Run specs
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/e2e/html-report
          retention-days: 7
