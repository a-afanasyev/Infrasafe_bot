server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CSP is set at the external infrasafe-nginx layer for /uk/* — do NOT duplicate here
    include /etc/nginx/security-headers.conf;

    # Hashed assets (immutable). External infrasafe-nginx strips the /uk/ prefix
    # before forwarding, so we serve /assets/, not /uk/assets/.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Prevent caching index.html (JS bundles have content hashes)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # PENT-F17: SPA НЕ должна отвечать на liveness-пробу. До этой location
    # `/uk/health` попадал в SPA-fallback ниже и отдавал `200 text/html` с
    # index.html — то есть мониторинг, настроенный «по очевидному URL», видел
    # здоровье при полностью мёртвом API: статику nginx отдаёт независимо от
    # него. Единственный правдивый публичный health — `/uk/api/health`
    # (JSON `{"ok":true}` из FastAPI, `api/routes/health.py`). Здесь честный
    # 404: пусть проба сломается громко, а не молчит зелёным.
    #
    # Проверено на profk 2026-07-26: `/uk/health` не опрашивает никто
    # (blackbox-пробы alloy идут на `https://profk.uz/health` — это приложение
    # InfraSafe на корне домена — и на `https://profk.uz/uk/`; Uptime Kuma — на
    # `/uk/`, `/health` и upstream-пути; у контейнера uk-frontend healthcheck'а
    # нет вообще). Ломать нечего.
    location = /health {
        access_log off;
        return 404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
