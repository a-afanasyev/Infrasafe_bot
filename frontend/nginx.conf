server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CSP is set at the external infrasafe-nginx layer for /uk/* — do NOT duplicate here
    include /etc/nginx/security-headers.conf;

    # Hashed assets (immutable). External infrasafe-nginx strips the /uk/ prefix
    # before forwarding, so we serve /assets/, not /uk/assets/.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Prevent caching index.html (JS bundles have content hashes)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
