# F-08 (аудит 2026-07-11): единый security-header сниппет.
#
# nginx НЕ наследует server-level add_header в location, где объявлен свой
# add_header — поэтому сниппет подключается include'ом и в server, и в каждом
# таком location. `always` — заголовки нужны и на 4xx/5xx.
#
# X-Frame-Options здесь НЕТ осознанно: Mini App (TWA) живёт в iframe
# web.telegram.org в веб-версии Telegram — DENY/SAMEORIGIN её сломают, а
# allowlist XFO не умеет. Защита от clickjacking — frame-ancestors в CSP на
# внешнем edge-nginx (зона InfraSafe, см. docs/audit/2026-07-24-f09-owner-checklist.md).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
